<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>교실 환경 지킴이</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #17262a; --sub: #56686d; --surface: #f5f8f8; --card: #ffffff;
    --line: #cfdcdd; --teal: #12606b; --teal-soft: #e1eeef;
    --warn: #b4441b; --warn-soft: #fbe9e1; --amber: #c96f22;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --ink: #e4eeef; --sub: #9cb0b4; --surface: #0f1b1d; --card: #16262a;
      --line: #2c4247; --teal: #6cc3cc; --teal-soft: #173a3f;
      --warn: #ff9a73; --warn-soft: #3d221a; --amber: #f0a868;
      color-scheme: dark;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--surface); color: var(--ink);
    font: 400 17px/1.55 "IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  }
  main { max-width: 1080px; margin: 0 auto; padding: 32px 24px 64px; }
  header { display: flex; justify-content: space-between; align-items: flex-end; gap: 24px; flex-wrap: wrap; margin-bottom: 28px; }
  .brand { font-size: 18px; font-weight: 700; color: var(--teal); margin: 0 0 4px; }
  .clock { font-size: 64px; font-weight: 700; line-height: 1; letter-spacing: -0.02em; margin: 0; font-variant-numeric: tabular-nums; }
  .day { color: var(--sub); margin: 6px 0 0; }
  .pick { display: flex; gap: 10px; align-items: end; flex-wrap: wrap; }
  .pick label { display: grid; gap: 4px; font-size: 14px; color: var(--sub); }
  .pick input, .pick button {
    font: inherit; padding: 9px 12px; border: 1px solid var(--line); border-radius: 9px;
    background: var(--card); color: var(--ink);
  }
  .pick button { cursor: pointer; }
  .pick input:focus-visible, .pick button:focus-visible { outline: 3px solid var(--teal); outline-offset: 2px; }
  .status { margin: 0 0 18px; color: var(--sub); min-height: 1.55em; }
  .status.empty { color: var(--amber); }
  .tiles { display: grid; grid-template-columns: repeat(5, 1fr); gap: 14px; }
  .tile {
    background: var(--card); border: 1px solid var(--line); border-radius: 14px;
    padding: 18px 18px 16px; min-height: 150px; display: flex; flex-direction: column;
  }
  .tile h2 { font-size: 15px; font-weight: 600; color: var(--sub); margin: 0 0 10px; }
  .tile .v { font-size: 40px; font-weight: 700; line-height: 1.1; font-variant-numeric: tabular-nums; }
  .tile .v small { font-size: 18px; font-weight: 600; margin-left: 2px; color: var(--sub); }
  .tile .note { margin-top: auto; padding-top: 10px; font-size: 14px; color: var(--sub); }
  .tile.bad { border: 2px solid var(--warn); background: var(--warn-soft); }
  .tile.bad .v, .tile.bad .note { color: var(--warn); }
  .tile.dim .v { color: var(--sub); }
  .row2 { display: grid; grid-template-columns: 2fr 1fr; gap: 14px; margin-top: 14px; }
  .panel { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 18px; }
  .panel h2 { font-size: 15px; font-weight: 600; color: var(--sub); margin: 0 0 10px; }
  .panel .big { font-size: 40px; font-weight: 700; line-height: 1.1; font-variant-numeric: tabular-nums; }
  .panel .small { font-size: 14px; color: var(--sub); margin: 8px 0 0; }
  .panel.alarm { border: 2px solid var(--amber); }
  .panel.alarm .big { color: var(--amber); }
  .advice-head { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
  #judge { font: inherit; font-weight: 700; padding: 10px 26px; border: 0; border-radius: 10px; background: var(--teal); color: #fff; cursor: pointer; }
  @media (prefers-color-scheme: dark) { #judge { color: #0f1b1d; } }
  #judge:focus-visible { outline: 3px solid var(--amber); outline-offset: 3px; }
  #judge:disabled { opacity: .5; cursor: default; }
  .advtemp { font-size: 22px; font-weight: 600; margin: 8px 0 0; min-height: 1.4em; }
  .panel.go { border: 2px solid var(--teal); }
  .panel.go .big { color: var(--teal); }
  .tag { display: inline-block; font-size: 12px; padding: 2px 8px; border-radius: 99px; border: 1px solid var(--line); color: var(--sub); margin-left: 6px; vertical-align: middle; }
  .bar { position: relative; height: 26px; background: var(--teal-soft); border-radius: 6px; margin: 14px 0 4px; overflow: hidden; }
  .bar span { position: absolute; top: 0; bottom: 0; background: var(--amber); }
  .ticks { display: flex; justify-content: space-between; font-size: 12px; color: var(--sub); }
  .periods { list-style: none; padding: 0; margin: 12px 0 0; display: flex; flex-wrap: wrap; gap: 8px; }
  .periods li { border: 1px solid var(--line); border-radius: 8px; padding: 4px 10px; font-size: 15px; font-variant-numeric: tabular-nums; }
  @media (max-width: 900px) { .row2 { grid-template-columns: 1fr; } }
  footer { margin-top: 36px; font-size: 14px; color: var(--sub); }
  footer a { color: var(--teal); }
  @media (max-width: 900px) { .tiles { grid-template-columns: repeat(2, 1fr); } .clock { font-size: 48px; } }
</style>
</head>
<body>
<main>
  <header>
    <div>
      <p class="brand">교실 환경 지킴이</p>
      <p class="clock" id="clock">--:--</p>
      <p class="day" id="day">기록을 불러오는 중</p>
    </div>
    <form class="pick" id="pick">
      <label>날짜 <input type="date" id="date" required></label>
      <label>시각 <input type="time" id="time" step="300" required></label>
      <button type="submit">다시 보기</button>
      <button type="button" id="latest">마지막 기록</button>
    </form>
  </header>

  <p class="status" id="status" role="status"></p>

  <section class="tiles" aria-label="교실 상태">
    <article class="tile" id="t-temp"><h2>온도</h2><div class="v">–</div><p class="note"></p></article>
    <article class="tile" id="t-humid"><h2>습도</h2><div class="v">–</div><p class="note">쾌적 범위 40~60%</p></article>
    <article class="tile" id="t-dust"><h2>미세먼지 센서</h2><div class="v">–</div><p class="note">상대값 (mV)</p></article>
    <article class="tile" id="t-light"><h2>조명</h2><div class="v">–</div><p class="note"></p></article>
    <article class="tile" id="t-people"><h2>재실</h2><div class="v">–</div><p class="note"></p></article>
  </section>

  <section class="row2">
    <article class="panel" id="advice">
      <h2>환기 판단 카드 <span class="tag">AI · HAIP 먼지 알림 + 기준표</span></h2>
      <div class="advice-head">
        <div class="big" id="advBig">판단 전</div>
        <button type="button" id="judge">판단</button>
      </div>
      <p class="advtemp" id="advTemp"></p>
      <p class="small" id="advReason">‘판단’을 누르면 이 시각의 환기 판단이 나와요.</p>
    </article>
    <article class="panel" id="dust">
      <h2>먼지 높음 알림 <span class="tag">AI · HAIP 모델 추정</span></h2>
      <div class="big" id="dustBig">–</div>
      <p class="small" id="dustNote"></p>
    </article>
  </section>
  <section class="panel" id="lights" style="margin-top:14px">
    <h2>이날 빈 교실 조명 <span class="tag">조명 켜짐 + 15분 넘게 움직임 없음</span></h2>
    <div class="big" id="wasteBig">–</div>
    <p class="small" id="wasteNote"></p>
    <div class="bar" id="bar" aria-hidden="true"></div>
    <div class="ticks"><span>0시</span><span>6시</span><span>12시</span><span>18시</span><span>24시</span></div>
    <ul class="periods" id="periods"></ul>
  </section>

  <footer>마이크로비트로 5분마다 잰 기록입니다 · v1.1 · <a href="/upload.html">측정 기록 올리기</a></footer>
</main>

<script>
const $ = (id) => document.getElementById(id);
const LIGHT_ON = 500; // 조도 500 이상 = 조명 켜짐 (10월 기록에서 300~500 사이 값이 하나도 없음)

function setTile(id, value, unit, note, state) {
  const el = $(id);
  el.className = "tile" + (state ? " " + state : "");
  el.querySelector(".v").innerHTML = unit ? `${value}<small>${unit}</small>` : value;
  if (note !== undefined) el.querySelector(".note").textContent = note;
}

function show(data) {
  if (data.range) {
    $("date").min = data.range.first.slice(0, 10);
    $("date").max = data.range.last.slice(0, 10);
  }
  if (!data.range) {
    $("status").className = "status empty";
    $("status").textContent = "아직 저장된 기록이 없습니다. 아래 '측정 기록 올리기'에서 CSV를 먼저 올리세요.";
    return;
  }
  const at = data.at;
  $("date").value = at.slice(0, 10);
  $("time").value = at.slice(11, 16);
  $("clock").textContent = at.slice(11, 16);
  const d = new Date(at);
  $("day").textContent = `${d.getMonth() + 1}월 ${d.getDate()}일 ${"일월화수목금토"[d.getDay()]}요일`;

  if (!data.found) {
    $("status").className = "status empty";
    $("status").textContent = `이 시각에는 기록이 없습니다. 기록이 있는 기간: ${data.range.first.slice(5, 16).replace("T", " ")} ~ ${data.range.last.slice(5, 16).replace("T", " ")}`;
    ["t-temp", "t-humid", "t-dust", "t-light", "t-people"].forEach((id) => setTile(id, "–", "", undefined, "dim"));
    currentTs = null; resetAdvice();
    loadDust(null);
    loadLights(at.slice(0, 10));
    return;
  }

  const r = data.reading;
  $("status").className = "status";
  $("status").textContent = data.gapMinutes
    ? `${data.gapMinutes}분 전 기록을 보여 줍니다 (기록은 5분 간격)`
    : "이 시각의 기록입니다";

  setTile("t-temp", r.temp_c.toFixed(1), "℃", `기압 ${r.press_hpa.toFixed(1)} hPa`);
  const humidBad = r.humid_pct < 40 || r.humid_pct > 60;
  setTile("t-humid", r.humid_pct.toFixed(1), "%", humidBad ? "40~60%를 벗어남" : "쾌적 범위 40~60%", humidBad ? "bad" : "");
  setTile("t-dust", r.dust_mv, "mV", "상대값 (mV)");
  const on = r.light >= LIGHT_ON;
  setTile("t-light", on ? "켜짐" : "꺼짐", "", `조도 ${r.light}`, on ? "" : "dim");
  const people = data.motion15 > 0;
  setTile("t-people", people ? "있음" : "없음", "", `최근 15분 움직임 ${data.motion15}회`, people ? "" : "dim");
  currentTs = r.ts; resetAdvice();
  loadDust(r.ts);
  loadLights(at.slice(0, 10));
}


async function getJSON(url) {
  const res = await fetch(url);
  const data = await res.json();
  if (!res.ok) throw new Error(data.error || `서버 응답 ${res.status}`);
  return data;
}

// F-06 먼지 높음 알림: 그 기록 시각 기준으로 5분 전 먼지 값을 HAIP 기준값과 비교
async function loadDust(ts) {
  const panel = $("dust");
  panel.className = "panel";
  if (!ts) { $("dustBig").textContent = "–"; $("dustNote").textContent = "이 시각에는 기록이 없습니다."; return; }
  try {
    const d = await getJSON(`/api/dust?t=${ts.slice(0, 16)}`);
    if (!d.available) { $("dustBig").textContent = "판단 불가"; $("dustNote").textContent = d.reason; return; }
    panel.className = d.alarm ? "panel alarm" : "panel";
    $("dustBig").textContent = d.alarm ? "먼지 높음" : "괜찮음";
    $("dustNote").textContent =
      `5분 전 먼지 ${d.dust5minAgo} mV ${d.alarm ? "≥" : "<"} ${d.hour}시 기준 ${d.trigger} mV · 모델 추정이라 갑자기 오른 첫 5분은 놓칠 수 있어요`;
  } catch (e) { $("dustBig").textContent = "–"; $("dustNote").textContent = `불러오지 못했습니다. ${e.message}`; }
}

// F-03 빈 교실 조명 구간: 고른 날짜 하루 전체
async function loadLights(date) {
  try {
    const d = await getJSON(`/api/lights?d=${date}`);
    if (!d.rows) {
      $("wasteBig").textContent = "–"; $("wasteNote").textContent = "이날은 기록이 없습니다.";
      $("bar").innerHTML = ""; $("periods").innerHTML = ""; return;
    }
    $("wasteBig").textContent = `${d.wasteMinutes}분`;
    $("wasteNote").textContent = `조명이 켜져 있던 ${d.litMinutes}분 중 · 구간 ${d.periods.length}개`;
    const pos = (ts) => { const t = new Date(ts); return ((t.getHours() * 60 + t.getMinutes()) / 1440) * 100; };
    $("bar").innerHTML = d.periods.map((p) =>
      `<span style="left:${pos(p.start)}%;width:${(p.minutes / 1440) * 100}%"></span>`).join("");
    $("periods").innerHTML = d.periods.map((p) =>
      `<li>${p.start.slice(11, 16)}부터 ${p.minutes}분</li>`).join("") || "<li>없음</li>";
  } catch (e) { $("wasteBig").textContent = "–"; $("wasteNote").textContent = `불러오지 못했습니다. ${e.message}`; }
}

// F-04 환기 판단 카드: '판단'을 눌러야 나온다 (사용자 테스트 S2에서 숫자만 먼저 보여 주기 위해)
let currentTs = null;
function resetAdvice() {
  $("advice").className = "panel";
  $("advBig").textContent = "판단 전";
  $("advTemp").textContent = "";
  $("advReason").textContent = currentTs ? "‘판단’을 누르면 이 시각의 환기 판단이 나와요." : "이 시각에는 기록이 없어 판단할 수 없어요.";
  $("judge").disabled = !currentTs;
}
$("judge").addEventListener("click", async () => {
  if (!currentTs) return;
  $("judge").disabled = true;
  $("advBig").textContent = "판단 중…";
  const t0 = performance.now();
  try {
    const d = await getJSON(`/api/advice?t=${currentTs.slice(0, 16)}`);
    const sec = ((performance.now() - t0) / 1000).toFixed(1);
    if (!d.found) { $("advBig").textContent = "판단 불가"; $("advReason").textContent = "이 시각에는 기록이 없어요."; return; }
    $("advice").className = d.decision.startsWith("환기하지") ? "panel" : (d.decision.startsWith("공기청정기") ? "panel alarm" : "panel go");
    $("advBig").textContent = d.decision;
    $("advTemp").textContent = d.temp ? `권장 냉난방 온도 ${d.temp}℃` : "냉난방 없이 지내도 되는 달이에요";
    $("advReason").textContent = `${d.reason} · 판단 ${sec}초`;
  } catch (e) {
    $("advBig").textContent = "–"; $("advReason").textContent = `판단하지 못했습니다. ${e.message}`;
  } finally { $("judge").disabled = false; }
});

async function load(t) {
  $("status").className = "status";
  $("status").textContent = "불러오는 중…";
  try {
    const res = await fetch(t ? `/api/state?t=${encodeURIComponent(t)}` : "/api/state");
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || `서버 응답 ${res.status}`);
    show(data);
  } catch (e) {
    $("status").className = "status empty";
    $("status").textContent = `기록을 불러오지 못했습니다. ${e.message}`;
  }
}

$("pick").addEventListener("submit", (e) => {
  e.preventDefault();
  load(`${$("date").value}T${$("time").value.slice(0, 5)}`);
});
$("latest").addEventListener("click", () => load());
// v1.1: 날짜나 시각을 바꾸면 버튼을 누르지 않아도 바로 그 시각으로 바뀐다 (사용자 테스트 피드백 반영)
["date", "time"].forEach((id) => $(id).addEventListener("change", () => {
  if ($("date").value && $("time").value) load(`${$("date").value}T${$("time").value.slice(0, 5)}`);
}));
load();
</script>
</body>
</html>
